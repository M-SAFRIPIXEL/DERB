<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="alternate icon" type="image/png" href="/logo.png" />
    <title>PHILOSTORYA فيلوستوريا | Luxury Moroccan Streetwear</title>
    <meta name="description" content="PHILOSTORYA (فيلوستوريا) — Premium minimalist Moroccan streetwear atelier. Heavyweight 500GSM cotton oversized hoodies, Arabic typography drops, and Cash on Delivery across Morocco." />
    <meta property="og:title" content="PHILOSTORYA فيلوستوريا | Luxury Moroccan Streetwear" />
    <meta property="og:description" content="PHILOSTORYA Moroccan Streetwear. Minimalist, heavyweight luxury streetwear tailored for Moroccan youth. Cash on Delivery across Casablanca, Rabat, Marrakech, Tangier and all Morocco." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    
    <!-- CDN Fonts: Arabic & Latin -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700;800;900&family=Bebas+Neue&family=Cairo:wght@400;600;700;800;900&family=Changa:wght@600;700;800;900&family=Lalezar&family=Permanent+Marker&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=Syne:wght@500;700;800;900&family=Unbounded:wght@600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/kvant" rel="stylesheet">
  </head>
  <body class="bg-[#0A0A0A] text-[#EDEDED] antialiased selection:bg-[#CCFF00] selection:text-black">
    <div id="root">
      <div style="min-height: 100vh; background-color: #0A0A0A; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; overflow: hidden; padding: 1rem; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
        <div style="display: flex; flex-direction: column; align-items: center; text-align: center; max-width: 24rem; margin: 0 auto;">
          <div style="position: relative; margin-bottom: 1.25rem;">
            <div style="width: 5.5rem; height: 5.5rem; border-radius: 1.5rem; background: #141414; border: 1px solid rgba(204,255,0,0.4); display: flex; align-items: center; justify-content: center; padding: 0.75rem; box-shadow: 0 0 35px rgba(204,255,0,0.25);">
              <img src="/logo.svg" onerror="this.src='/logo.png'" alt="PHILOSTORYA Logo" style="width: 3.5rem; height: 3.5rem; object-fit: contain; filter: drop-shadow(0 0 12px rgba(204,255,0,0.45));" />
            </div>
          </div>
          <div style="margin-bottom: 1.25rem;">
            <div style="font-size: 1.5rem; font-weight: 900; letter-spacing: 0.1em; color: #FFFFFF; font-family: 'Kvant', sans-serif;">PHILOSTORYA</div>
            <div style="font-size: 1.1rem; font-weight: 800; color: #CCFF00; margin-top: 0.25rem; font-family: 'Alexandria', 'Cairo', sans-serif;">فيلوستوريا</div>
            <div style="font-size: 0.65rem; font-family: monospace; letter-spacing: 0.25em; color: rgba(255,255,255,0.4); text-transform: uppercase; margin-top: 0.35rem;">Moroccan Luxury Streetwear</div>
          </div>
          <div style="width: 9rem; height: 3px; background: #1F1F1F; border-radius: 9999px; overflow: hidden; position: relative; margin-bottom: 0.75rem; border: 1px solid rgba(255,255,255,0.05);">
            <div style="height: 100%; width: 50%; background: linear-gradient(90deg, transparent, #CCFF00, transparent); border-radius: 9999px; position: absolute; animation: initialShimmer 1.4s ease-in-out infinite;"></div>
          </div>
          <div style="color: rgba(255,255,255,0.5); font-size: 0.75rem;">Loading Atelier...</div>
        </div>
        <style>
          @keyframes initialShimmer {
            0% { transform: translateX(-150%); }
            100% { transform: translateX(250%); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
